components:
    parameters:
        MailBodyCompression:
            description: Use this header when sending a gzip compressed mail body. Mail body compression is available to some high volume accounts. Submit a [request to support](https://support.sendgrid.com/hc/en-us) to have gzip enabled on your account.
            in: header
            name: Content-Encoding
            required: false
            schema:
                $ref: '#/components/schemas/ContentEncoding'
                type: string
    requestBodies:
        PostMailSend:
            content:
                application/json:
                    schema:
                        properties:
                            asm:
                                description: An object allowing you to specify how to handle unsubscribes.
                                properties:
                                    group_id:
                                        description: The unsubscribe group to associate with this email.
                                        type: integer
                                    groups_to_display:
                                        description: An array containing the unsubscribe groups to display to a recipient on the unsubscribe preferences page.
                                        items:
                                            type: integer
                                        maxItems: 25
                                        type: array
                                required:
                                    - group_id
                                type: object
                            attachments:
                                description: An array of objects where you can define any attachments to be included with the message.
                                items:
                                    properties:
                                        content:
                                            description: The Base64 encoded content of the attachment.
                                            minLength: 1
                                            type: string
                                        content_id:
                                            description: The attachment's content ID, used when disposition is inline.
                                            type: string
                                        disposition:
                                            $ref: '#/components/schemas/Disposition'
                                            default: attachment
                                            description: How the attachment should be displayed.
                                            type: string
                                        filename:
                                            description: The attachment's filename, including the file extension.
                                            type: string
                                        type:
                                            description: The MIME type of the content you are attaching.
                                            minLength: 1
                                            type: string
                                    required:
                                        - content
                                        - filename
                                    type: object
                                type: array
                            batch_id:
                                description: An ID representing a batch of emails to be sent at the same time.
                                type: string
                            categories:
                                description: An array of category names assigned to this message.
                                items:
                                    maxLength: 255
                                    type: string
                                maxItems: 10
                                type: array
                                uniqueItems: true
                            content:
                                description: An array of objects, each containing a message body's content and MIME type.
                                items:
                                    properties:
                                        type:
                                            description: The MIME type of the content assigned in value (e.g. text/plain or text/html).
                                            minLength: 1
                                            type: string
                                        value:
                                            description: The content of your message in the specified MIME type.
                                            minLength: 1
                                            type: string
                                    required:
                                        - type
                                        - value
                                    type: object
                                type: array
                            custom_args:
                                description: Values that are specific to the entire send that will be carried along with the email and its activity data.
                                type: string
                            from:
                                $ref: '#/components/schemas/MailFrom'
                            headers:
                                description: A collection of property name/value pairs allowing you to specify handling instructions for your email.
                                type: object
                            ip_pool_name:
                                description: The IP Pool that you would like to send this email from.
                                maxLength: 64
                                minLength: 2
                                type: string
                            mail_settings:
                                description: A collection of different mail settings that you can use to specify how you would like this email to be handled.
                                type: object
                            personalizations:
                                description: An array of messages and their metadata; each object defines who should receive an individual message and how it should be handled.
                                items:
                                    properties:
                                        bcc:
                                            description: Recipients to whom a blind carbon copy of your email will be sent.
                                            items:
                                                $ref: '#/components/schemas/MailTo'
                                            maxItems: 1000
                                            type: array
                                        cc:
                                            description: Recipients to whom a copy of the email will be sent.
                                            items:
                                                $ref: '#/components/schemas/MailTo'
                                            maxItems: 1000
                                            type: array
                                        custom_args:
                                            description: Values specific to this personalization, carried with the email and its activity data.
                                            maxProperties: 10000
                                            type: object
                                        dynamic_template_data:
                                            description: Property names substituted by their values in subject, reply-to and content for a Dynamic Template.
                                            type: object
                                        from:
                                            $ref: '#/components/schemas/MailFrom'
                                        headers:
                                            description: Handling instructions for this personalization.
                                            type: object
                                        send_at:
                                            description: A unix timestamp allowing you to specify when your email should be sent.
                                            type: integer
                                        subject:
                                            description: The subject of your email.
                                            minLength: 1
                                            type: string
                                        substitutions:
                                            additionalProperties:
                                                type: string
                                            description: Property names substituted by their values in subject, reply-to and content.
                                            maxProperties: 10000
                                            type: object
                                        to:
                                            description: Recipients to whom the email will be sent.
                                            items:
                                                $ref: '#/components/schemas/MailTo'
                                            type: array
                                    required:
                                        - to
                                    type: object
                                maxItems: 1000
                                type: array
                                uniqueItems: false
                            reply_to:
                                $ref: '#/components/schemas/MailTo'
                            reply_to_list:
                                description: Recipients to whom replies will be sent.
                                items:
                                    $ref: '#/components/schemas/MailTo'
                                maxItems: 1000
                                type: array
                                uniqueItems: true
                            send_at:
                                description: A unix timestamp allowing you to specify when your email should be sent.
                                type: integer
                            subject:
                                description: The global or message level subject of your email.
                                minLength: 1
                                type: string
                            template_id:
                                description: An email template ID, standard or dynamic (prefixed d-).
                                type: string
                            tracking_settings:
                                description: Settings to determine how you would like to track the metrics of how recipients interact with your email.
                                type: object
                        required:
                            - personalizations
                            - from
                        type: object
    responses:
        PostMailSend400:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail Send bad response.
        PostMailSend401:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail Send unauthorized response.
        PostMailSend403:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail Send forbidden response.
        PostMailSend404:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail Send not found response.
        PostMailSend405:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail Send method not allowed response.
        PostMailSend413:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail Send content too large response.
        PostMailSend500:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Mail send internal server error response.
    schemas:
        ContentEncoding:
            enum:
                - gzip
            type: string
        Disposition:
            enum:
                - inline
                - attachment
            type: string
        ErrorResponse:
            properties:
                errors:
                    items:
                        properties:
                            field:
                                description: The field that generated the error, when applicable.
                                nullable: true
                                type: string
                            help:
                                description: Helper text or a link to documentation, when applicable.
                                type: object
                            message:
                                description: An error message.
                                type: string
                        type: object
                    type: array
                id:
                    description: An error ID, when applicable.
                    type: string
            type: object
        MailFrom:
            properties:
                email:
                    description: The email address from which messages are sent. This address should be a verified sender in your SendGrid account.
                    format: email
                    type: string
                name:
                    description: A name or title associated with the email address.
                    type: string
            required:
                - email
            title: From Email Object
            type: object
        MailTo:
            properties:
                email:
                    description: An email address to which a message is sent.
                    format: email
                    type: string
                name:
                    description: A name or title associated with the email address.
                    type: string
            required:
                - email
            title: To Email Object
            type: object
    securitySchemes:
        BearerAuth:
            description: SendGrid requires you to authenticate with its APIs using an API key, sent as a bearer token in the Authorization header.
            scheme: bearer
            type: http
info:
    description: The Twilio SendGrid v3 Mail API allows you to send email at scale over HTTP.
    title: Twilio SendGrid Mail API
    version: 1.0.0
openapi: 3.0.3
paths:
    /v3/mail/send:
        post:
            description: Send an email over SendGrid's v3 Web API.
            operationId: SendMail
            parameters:
                - $ref: '#/components/parameters/MailBodyCompression'
            requestBody:
                $ref: '#/components/requestBodies/PostMailSend'
            responses:
                "202":
                    description: Accepted
                "400":
                    $ref: '#/components/responses/PostMailSend400'
                "401":
                    $ref: '#/components/responses/PostMailSend401'
                "403":
                    $ref: '#/components/responses/PostMailSend403'
                "404":
                    $ref: '#/components/responses/PostMailSend404'
                "405":
                    $ref: '#/components/responses/PostMailSend405'
                "413":
                    $ref: '#/components/responses/PostMailSend413'
                "500":
                    $ref: '#/components/responses/PostMailSend500'
            summary: Send Email with Twilio SendGrid.
            tags:
                - Mail Send
security:
    - BearerAuth: []
servers:
    - description: for global users and subusers
      url: https://api.sendgrid.com
