type Query {
  "Allocations of a set of consultants in a period, with their employee details."
  allocations(filter: AllocationsByEmailFilter!): [AllocationWithEmployeeInfo!]!
  engagements(filter: EngagementFilter!, includeFundingSources: Boolean!, includeEngagementConsultants: Boolean!, stringFilter: StringFilter!, order: EngagementTableOrder!, limit: Int!, offset: Int!): [Engagement!]!
  "The same search shaped for the approval queue."
  engagementsForApprovalProcess(filter: EngagementFilter!, includeFundingSources: Boolean!, includeEngagementConsultants: Boolean!, stringFilter: StringFilter!, order: EngagementTableOrder!, limit: Int!, offset: Int!): [Engagement!]!
  engagement(id: String!, includeFundingSources: Boolean!): Engagement
  engagementAllocations(filter: EngagementAllocationFilter!, stringFilter: StringFilter, includeFundingSources: Boolean!, order: AllocationTableOrder, limit: Int, offset: Int): [Allocation!]!
  "A consultant's allocations over a date range, for the report."
  consultantAllocations(filter: ConsultantAllocationFilter!, limit: Int!, offset: Int!, includeFundingSources: Boolean!): [ConsultantAllocation!]!
  nonAllocatedEmployees(filter: NonAllocatedEmployeeFilter!, limit: Int!, offset: Int!): [Employee!]!
  "Visa records for a consultant, country and date window."
  visas(filter: VisaFilter!): [Visa!]!
}

type Mutation {
  "Adds new allocations and updates overlapped ones in one call, with the allocation log and the acting user."
  bulkUploadAllocations(input: BulkAllocationsInput!): BulkAllocationUploadResult!
  addEngagement(input: InsertEngagementInput!): Engagement!
  updateEngagement(input: UpdateEngagementInput!): Engagement!
  updateAllocation(input: UpdateAllocationInput!): Allocation!
  "Marks the allocation Deleted; nothing is destroyed."
  setAllocationStatusDeleted(id: String!): String!
}

